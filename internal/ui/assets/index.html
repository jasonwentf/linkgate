<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light dark">
<title>Linkgate</title>
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='%230F9D8F' stroke-width='2.6' stroke-linecap='round' stroke-linejoin='round'%3E%3Cpath d='M3 5.5C9 5.5 10 12 15 12'/%3E%3Cpath d='M3 18.5C9 18.5 10 12 15 12'/%3E%3Cpath d='M15 12H21'/%3E%3C/svg%3E">
<style>
:root {
  color-scheme: light dark;
  --bg: #f5f5f7; --surface: #fff; --sidebar: rgba(235,236,240,.78); --field: #f2f2f5; --node: #f5f5f7;
  --text: #242427; --muted: #65656b; --faint: #8e8e93; --line: rgba(60,60,67,.12); --hover: rgba(60,60,67,.06); --press: rgba(60,60,67,.1);
  --accent: #0067d5; --accent-soft: rgba(0,103,213,.09); --on-accent: #fff; --flow: rgba(0,103,213,.42);
  --ok: #247746; --ok-soft: rgba(36,119,70,.09); --warn: #9a5a08; --warn-soft: rgba(154,90,8,.09);
  --err: #c03334; --err-soft: rgba(192,51,52,.08); --shadow: 0 24px 80px rgba(0,0,0,.2); --card-shadow: 0 1px 2px rgba(0,0,0,.04);
  --r-card: 14px; --r-ctl: 8px; --r-tag: 6px; --r-dialog: 16px;
  --pad-x: max(32px, calc((100% - 1040px) / 2 + 32px));
  --mono: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
}
@media (prefers-color-scheme: dark) {
  :root {
    color-scheme: dark;
    --bg: #1c1c1e; --surface: #2c2c2e; --sidebar: rgba(36,36,39,.85); --field: #38383b; --node: #353538;
    --text: #f0f0f2; --muted: #b0b0b8; --faint: #8e8e96; --line: rgba(235,235,245,.12); --hover: rgba(235,235,245,.07); --press: rgba(235,235,245,.12);
    --accent: #64adff; --accent-soft: rgba(100,173,255,.14); --on-accent: #102237; --flow: rgba(100,173,255,.45);
    --ok: #76cf94; --ok-soft: rgba(118,207,148,.1); --warn: #efb35e; --warn-soft: rgba(239,179,94,.1);
    --err: #ff8c8c; --err-soft: rgba(255,140,140,.1); --shadow: 0 24px 80px rgba(0,0,0,.5); --card-shadow: none;
  }
}
html[data-theme=dark] { --bg:#1c1c1e; --surface:#2c2c2e; --sidebar:rgba(36,36,39,.85); --field:#38383b; --node:#353538; --text:#f0f0f2; --muted:#b0b0b8; --faint:#8e8e96; --line:rgba(235,235,245,.12); --hover:rgba(235,235,245,.07); --press:rgba(235,235,245,.12); --accent:#64adff; --accent-soft:rgba(100,173,255,.14); --on-accent:#102237; --flow:rgba(100,173,255,.45); --ok:#76cf94; --ok-soft:rgba(118,207,148,.1); --warn:#efb35e; --warn-soft:rgba(239,179,94,.1); --err:#ff8c8c; --err-soft:rgba(255,140,140,.1); --shadow:0 24px 80px rgba(0,0,0,.5); --card-shadow:none; }
html[data-theme=light] { --bg:#f5f5f7; --surface:#fff; --sidebar:rgba(235,236,240,.78); --field:#f2f2f5; --node:#f5f5f7; --text:#242427; --muted:#65656b; --faint:#8e8e93; --line:rgba(60,60,67,.12); --hover:rgba(60,60,67,.06); --press:rgba(60,60,67,.1); --accent:#0067d5; --accent-soft:rgba(0,103,213,.09); --on-accent:#fff; --flow:rgba(0,103,213,.42); --ok:#247746; --ok-soft:rgba(36,119,70,.09); --warn:#9a5a08; --warn-soft:rgba(154,90,8,.09); --err:#c03334; --err-soft:rgba(192,51,52,.08); --shadow:0 24px 80px rgba(0,0,0,.2); --card-shadow:0 1px 2px rgba(0,0,0,.04); }
* { box-sizing: border-box; }
[hidden] { display: none !important; }
html, body { margin: 0; height: 100%; }
body { background: var(--bg); color: var(--text); font: 13px/1.5 -apple-system, "SF Pro Text", "PingFang SC", BlinkMacSystemFont, "Segoe UI", sans-serif; -webkit-font-smoothing: antialiased; }
button, input, textarea, select { font: inherit; color: inherit; }
button { border: 0; border-radius: var(--r-ctl); background: var(--field); min-height: 32px; padding: 6px 12px; cursor: pointer; display: inline-flex; align-items: center; justify-content: center; gap: 6px; white-space: nowrap; line-height: 1.4; transition: background 120ms, color 120ms, opacity 120ms; }
button:hover { background: var(--press); }
button.primary { background: var(--accent); color: var(--on-accent); font-weight: 500; }
button.primary:hover { background: var(--accent); opacity: .86; }
button.quiet { background: transparent; color: var(--muted); }
button.quiet:hover { background: var(--hover); color: var(--text); }
button.danger { color: var(--err); background: var(--err-soft); }
button:disabled { opacity: .4; cursor: default; }
button:disabled:hover { background: inherit; }
button.quiet:disabled:hover { background: transparent; }
button.icon { width: 32px; height: 32px; min-height: 0; padding: 0; flex: none; }
button.small { min-height: 28px; padding: 4px 10px; font-size: 12px; }
select { appearance: none; -webkit-appearance: none; border: 0; border-radius: var(--r-ctl); background-color: var(--field); min-height: 28px; padding: 4px 28px 4px 10px; font-size: 12px; cursor: pointer;
  background-image: linear-gradient(45deg, transparent 50%, var(--muted) 50%), linear-gradient(135deg, var(--muted) 50%, transparent 50%);
  background-position: calc(100% - 15px) 52%, calc(100% - 11px) 52%; background-size: 4px 4px; background-repeat: no-repeat; }
select:disabled { opacity: .5; cursor: default; }
svg { width: 16px; height: 16px; flex: none; fill: none; stroke: currentColor; stroke-width: 1.7; stroke-linecap: round; stroke-linejoin: round; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
h1, h2, h3, p, dl { margin: 0; }
h1 { font-size: 24px; line-height: 1.25; letter-spacing: -.5px; font-weight: 600; overflow-wrap: anywhere; }
h2 { font-size: 15px; font-weight: 600; letter-spacing: -.1px; }
h3 { font-size: 14px; font-weight: 600; }
.muted { color: var(--muted); }
.mono { font-family: var(--mono); font-size: 12px; font-variant-numeric: tabular-nums; }
.spacer { flex: 1; }
.dot { width: 7px; height: 7px; border-radius: 50%; background: var(--muted); display: inline-block; flex: none; }
.dot.healthy, .dot.ok { background: var(--ok); }
.dot.unhealthy, .dot.err { background: var(--err); }
.dot.unknown, .dot.warn, .dot.reachable { background: var(--warn); }
.dot.disabled { background: var(--faint); }
.segmented { display: inline-flex; background: var(--field); border-radius: var(--r-ctl); padding: 2px; gap: 2px; flex: none; }
.segmented button { min-height: 24px; padding: 2px 10px; font-size: 12px; border-radius: 6px; background: transparent; color: var(--muted); }
.segmented button:hover { background: var(--hover); color: var(--text); }
.segmented button[aria-pressed=true] { background: var(--surface); color: var(--text); font-weight: 500; box-shadow: 0 1px 2px rgba(0,0,0,.08); }

/* ---------- Shell & sidebar ---------- */
.shell { height: 100%; display: grid; grid-template-columns: 248px minmax(0,1fr); grid-template-rows: minmax(0,1fr) auto auto; }
.sidebar { grid-row: 1 / -1; background: var(--sidebar); backdrop-filter: blur(24px); display: flex; flex-direction: column; min-height: 0; padding: 20px 12px 12px; border-right: 1px solid var(--line); }
.brand { display: flex; gap: 10px; align-items: center; padding: 0 4px 20px 10px; }
.brand-mark { width: 32px; height: 32px; border-radius: 9px; background: var(--accent); color: var(--on-accent); display: grid; place-items: center; flex: none; }
.brand-mark svg { width: 18px; height: 18px; }
.brand-name { font-size: 15px; font-weight: 600; letter-spacing: -.3px; line-height: 1.3; }
.brand > div:nth-child(2) { min-width: 0; }
.brand-sub { font-size: 11px; color: var(--muted); line-height: 1.4; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
#collapseSidebar { margin-left: auto; }
.nav-item, .service-item { width: 100%; min-height: 0; padding: 6px 10px; margin: 1px 0; text-align: left; background: transparent; justify-content: flex-start; gap: 10px; border-radius: var(--r-ctl); color: var(--text); }
.nav-item:hover, .service-item:hover { background: var(--hover); }
.nav-item.selected, .service-item.selected { background: var(--accent-soft); }
.nav-item .nav-icon, .service-item .service-icon { width: 28px; height: 28px; display: grid; place-items: center; border-radius: 7px; color: var(--muted); flex: none; }
.nav-item.selected .nav-icon, .service-item.selected .service-icon { color: var(--accent); }
.nav-item.selected { color: var(--accent); font-weight: 500; }
.nav-item.accent { color: var(--accent); }
.nav-item.accent .nav-icon { color: var(--accent); }
.nav-item:disabled:hover { background: transparent; }
.search { display: flex; align-items: center; background: var(--hover); border-radius: var(--r-ctl); gap: 8px; height: 32px; padding: 0 10px; margin: 8px 0 16px; color: var(--muted); }
.search input { min-width: 0; width: 100%; background: transparent; border: 0; outline: none; font-size: 12px; padding: 0; }
.search input::-webkit-search-cancel-button { display: none; }
.search:focus-within { box-shadow: 0 0 0 2px var(--accent); }
.services-disclosure { display: flex; flex-direction: column; min-height: 0; flex: 1; }
.services-disclosure > summary { cursor: pointer; color: var(--muted); font-size: 11px; font-weight: 600; padding: 2px 10px 6px; list-style: none; display: flex; align-items: center; gap: 6px; user-select: none; }
.services-disclosure > summary::-webkit-details-marker { display: none; }
.services-disclosure > summary::before { content: ""; width: 5px; height: 5px; border-right: 1.5px solid currentColor; border-bottom: 1.5px solid currentColor; transform: rotate(-45deg); transition: transform 120ms; margin: 0 2px 0 1px; }
.services-disclosure[open] > summary::before { transform: rotate(45deg) translate(-1px,-1px); }
.services-disclosure:not([open]) { flex: none; }
.service-list { overflow: auto; min-height: 0; padding: 0 0 8px; }
.service-item { padding: 8px 10px; }
.service-item .service-icon { background: var(--surface); box-shadow: var(--card-shadow); }
.service-item .service-text { min-width: 0; flex: 1; }
.service-item strong { font-size: 13px; font-weight: 500; display: block; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; line-height: 1.35; }
.service-item small { font-size: 11px; color: var(--muted); display: block; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; margin-top: 1px; }
.service-item .dot { margin-right: 2px; }
.service-list > .empty { padding: 16px 10px; font-size: 12px; text-align: left; }
.sidebar-add { margin-top: 4px; }
.sidebar-foot { margin-top: auto; padding-top: 8px; border-top: 1px solid var(--line); color: var(--muted); font-size: 11px; }
.sidebar-foot p { padding: 6px 10px 2px; line-height: 1.55; color: var(--faint); }

/* ---------- Workspace ---------- */
.workspace { min-width: 0; overflow: auto; }
.toolbar { height: 52px; display: flex; align-items: center; gap: 12px; padding: 0 var(--pad-x); position: sticky; top: 0; z-index: 3; background: var(--bg); }
.toolbar .sidebar-toggle { margin-left: -6px; }
.breadcrumb { font-size: 12px; color: var(--muted); display: flex; align-items: center; gap: 6px; min-width: 0; }
.breadcrumb span:last-child { color: var(--text); font-weight: 500; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.toolbar > #reload { margin-right: -10px; }
.content { max-width: 1040px; padding: 12px 32px 48px; margin: 0 auto; }
.notice { background: var(--accent-soft); color: var(--accent); padding: 10px 16px; border-radius: var(--r-ctl); margin-bottom: 20px; white-space: pre-wrap; overflow-wrap: anywhere; font-size: 12px; }
.notice.bad { color: var(--err); background: var(--err-soft); }
.service-heading { display: flex; align-items: flex-start; gap: 16px; margin-bottom: 28px; }
.service-heading .intro { flex: 1; min-width: 0; }
.service-comment { color: var(--muted); margin-top: 6px; overflow-wrap: anywhere; }
.service-tools { display: flex; gap: 2px; margin-right: -6px; }
.service-info { display: flex; align-items: center; gap: 12px; margin-top: 14px; flex-wrap: wrap; }
p.service-info { margin-top: 10px; font-size: 12px; }
.address { display: inline-flex; align-items: center; gap: 6px; height: 32px; padding: 0 4px 0 12px; background: var(--surface); border-radius: var(--r-ctl); box-shadow: var(--card-shadow); }
.address button.icon { width: 26px; height: 26px; border-radius: 6px; }
.address svg { width: 14px; height: 14px; }
.service-health { display: inline-flex; align-items: center; gap: 6px; color: var(--muted); font-size: 12px; }
.section-heading { display: flex; align-items: center; gap: 8px; margin-bottom: 12px; flex-wrap: wrap; min-height: 32px; }
.section-heading .caption { color: var(--muted); font-size: 12px; }
.section-heading > button.quiet:last-child { margin-right: -10px; }
.section-hint { color: var(--muted); font-size: 12px; margin: -6px 0 12px; }

/* ---------- Route cards ---------- */
.routes { display: flex; flex-direction: column; gap: 12px; }
.route { position: relative; background: var(--surface); border-radius: var(--r-card); padding: 16px 20px 12px; min-width: 0; box-shadow: var(--card-shadow); }
.route.active::before { content: ""; position: absolute; left: 0; top: 18px; bottom: 18px; width: 3px; border-radius: 0 3px 3px 0; background: var(--accent); }
.route-top { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; min-height: 24px; }
.route-name { min-width: 0; overflow-wrap: anywhere; }
.kind { font-size: 10px; letter-spacing: .4px; font-weight: 600; background: var(--field); color: var(--muted); height: 20px; padding: 0 6px; border-radius: var(--r-tag); display: inline-flex; align-items: center; font-family: var(--mono); }
.priority { font-size: 11px; color: var(--muted); }
.current { background: var(--accent-soft); color: var(--accent); font-size: 11px; height: 20px; padding: 0 8px; border-radius: var(--r-tag); display: inline-flex; align-items: center; font-weight: 500; }
.pill { font-size: 11px; display: inline-flex; align-items: center; gap: 5px; height: 22px; padding: 0 9px; border-radius: 99px; color: var(--muted); background: var(--field); font-weight: 500; white-space: nowrap; }
.pill.healthy { color: var(--ok); background: var(--ok-soft); }
.pill.unhealthy { color: var(--err); background: var(--err-soft); }
.pill.unknown, .pill.reachable { color: var(--warn); background: var(--warn-soft); }
.route-url { color: var(--muted); overflow: hidden; white-space: nowrap; text-overflow: ellipsis; margin-top: 8px; }
.route-comment { color: var(--muted); font-size: 12px; margin-top: 2px; overflow-wrap: anywhere; }
.stats { display: grid; grid-template-columns: repeat(6,minmax(0,1fr)); gap: 12px; margin: 16px 0 14px; }
.stats dt { color: var(--muted); font-size: 11px; }
.stats dd { margin: 2px 0 0; font-size: 15px; font-weight: 500; font-variant-numeric: tabular-nums; letter-spacing: -.2px; }
.route-bottom { display: flex; align-items: center; gap: 6px; flex-wrap: wrap; border-top: 1px solid var(--line); padding-top: 12px; }
.route-bottom > button:not(.icon) { min-height: 28px; padding: 4px 12px; font-size: 12px; }
.route-bottom .result { margin-left: 6px; }
.route-bottom .order { display: flex; gap: 2px; margin-left: auto; margin-right: -6px; }
.route-bottom .icon { width: 28px; height: 28px; }
.result { font-size: 12px; color: var(--muted); overflow-wrap: anywhere; }
.result.good { color: var(--ok); }
.result.warn { color: var(--warn); }
.result.bad, .route-error { color: var(--err); }
.route-error { font-size: 12px; margin-top: 10px; overflow-wrap: anywhere; }
.route-error.reachable { color: var(--warn); }

/* ---------- Dashboard ---------- */
.dashboard-heading { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; margin-bottom: 8px; }
.dashboard-heading label { font-size: 12px; }
.dashboard-summary { display: flex; gap: 6px 18px; flex-wrap: wrap; margin-bottom: 24px; color: var(--muted); font-size: 12px; }
.dashboard-summary b { color: var(--text); font-weight: 600; font-variant-numeric: tabular-nums; }
.dashboard-grid { display: grid; grid-template-columns: repeat(auto-fill,minmax(280px,1fr)); gap: 16px; }
.dashboard-card { background: var(--surface); border-radius: var(--r-card); padding: 18px 20px 12px; display: flex; flex-direction: column; box-shadow: var(--card-shadow); min-width: 0; }
.card-head { display: flex; align-items: center; gap: 10px; min-width: 0; }
.card-head h2 { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.dashboard-card .mono { margin-top: 6px; overflow-wrap: anywhere; color: var(--muted); }
.dashboard-card .card-line { margin-top: 2px; font-size: 12px; color: var(--muted); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.dashboard-card .card-line b { color: var(--text); font-weight: 500; }
.dashboard-card .stats { grid-template-columns: repeat(4,minmax(0,1fr)); margin: 16px 0 14px; }
.dashboard-card .route-bottom { margin-top: auto; }
.page-foot { color: var(--faint); font-size: 11px; margin-top: 16px; }
.dash-flow-section { margin-top: 36px; }
.dash-flow-grid { display: grid; grid-template-columns: repeat(auto-fill,minmax(440px,1fr)); gap: 16px; }
.dash-flow-card { background: var(--surface); border-radius: var(--r-card); box-shadow: var(--card-shadow); min-width: 0; display: flex; flex-direction: column; }
.dash-flow-card > .card-head { padding: 14px 16px 0; }
.dash-flow-card > .card-head h3 { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.dash-flow-card > .card-head .caption { color: var(--muted); font-size: 11px; font-variant-numeric: tabular-nums; white-space: nowrap; }
.dash-flow-card > .card-head button { margin-right: -8px; }
.dash-flow-card .flow-canvas { box-shadow: none; background: transparent; padding: 10px 16px 0; }
.dash-flow-card .flow-empty-mini { color: var(--muted); font-size: 12px; padding: 22px 16px 26px; text-align: center; }
.flow-canvas.compact .flow-columns { gap: 16px; padding-bottom: 14px; }
.flow-canvas.compact .flow-col { width: min(190px, 38%); }
.flow-canvas.compact .flow-col-head { margin-bottom: 6px; }
.flow-canvas.compact .flow-nodes { gap: 6px; }
.flow-canvas.compact .flow-node { height: 38px; border-radius: 8px; padding: 0 10px; grid-template-rows: auto; }
.flow-canvas.compact .flow-node strong { font-size: 12px; }
.flow-canvas.compact .flow-node small { display: none; }
.flow-canvas.compact .flow-node .num { grid-row: 1; font-size: 12px; }
.flow-canvas.compact .flow-node.line-node strong .dot { margin-right: 6px; vertical-align: 1px; }
.flow-canvas.compact .flow-node.active::before { top: 9px; bottom: 9px; }
.dash-flow-legend { display: flex; flex-wrap: wrap; gap: 6px 18px; font-size: 11px; color: var(--muted); margin-top: 12px; }
.dash-flow-legend span { display: inline-flex; align-items: center; gap: 6px; }
.dash-flow-legend i { display: inline-block; width: 18px; height: 0; border-top: 2px solid var(--flow); }
.dash-flow-legend i.failed { border-top-color: var(--err); }
.dash-flow-legend i.undelivered { border-top: 2px dashed var(--err); }

/* ---------- Flow: callers -> lines ---------- */
.flow-section { margin-top: 36px; }
.flow-canvas { position: relative; background: var(--surface); border-radius: var(--r-card); padding: 16px 20px 0; box-shadow: var(--card-shadow); }
.flow-columns { display: flex; justify-content: space-between; gap: 24px; position: relative; z-index: 1; padding-bottom: 16px; }
.flow-col { width: min(240px, 34%); display: flex; flex-direction: column; min-width: 0; }
.flow-col-head { display: flex; align-items: center; gap: 6px; font-size: 11px; font-weight: 600; color: var(--muted); height: 20px; margin-bottom: 8px; padding-left: 2px; }
.flow-col-head .count { background: var(--field); border-radius: 99px; padding: 0 7px; font-weight: 500; font-variant-numeric: tabular-nums; }
.flow-nodes { display: flex; flex-direction: column; justify-content: center; gap: 8px; flex: 1; }
.flow-node { position: relative; height: 52px; min-height: 0; display: grid; grid-template-columns: minmax(0,1fr) auto; grid-template-rows: auto auto; align-items: center; column-gap: 10px; row-gap: 1px; text-align: left; white-space: nowrap; background: var(--node); border-radius: 10px; padding: 0 12px; box-shadow: inset 0 0 0 1px var(--line); }
.flow-node:hover { background: var(--node); box-shadow: inset 0 0 0 1px var(--press), 0 1px 3px rgba(0,0,0,.06); }
.flow-node strong { font-weight: 500; font-size: 13px; overflow: hidden; text-overflow: ellipsis; min-width: 0; line-height: 1.3; }
.flow-node small { font-size: 11px; color: var(--muted); overflow: hidden; text-overflow: ellipsis; min-width: 0; display: flex; align-items: center; gap: 5px; line-height: 1.3; }
.flow-node .num { grid-row: 1 / span 2; grid-column: 2; font-size: 13px; font-weight: 500; font-variant-numeric: tabular-nums; color: var(--text); }
.flow-node .share { flex: 1; max-width: 96px; height: 3px; border-radius: 2px; background: var(--line); overflow: hidden; }
.flow-node .share span { display: block; height: 100%; background: var(--muted); opacity: .55; border-radius: 2px; }
.flow-node.active::before { content: ""; position: absolute; left: 0; top: 12px; bottom: 12px; width: 3px; border-radius: 0 3px 3px 0; background: var(--accent); }
.flow-node.selected { box-shadow: inset 0 0 0 1.5px var(--accent); }
.flow-node.dim { opacity: .45; }
.flow-node.virtual { background: transparent; box-shadow: inset 0 0 0 1px var(--line); border: 0; }
.flow-node.virtual strong { color: var(--muted); }
.flow-node .kind { height: 16px; font-size: 9px; padding: 0 4px; margin-left: 2px; vertical-align: 1px; }
.flow-svg { position: absolute; inset: 0; width: 100%; height: 100%; pointer-events: none; z-index: 0; overflow: visible; }
.flow-svg path { fill: none; stroke: var(--flow); stroke-linecap: butt; transition: opacity 120ms; }
.flow-svg path.reachable { stroke: var(--warn); opacity: .5; }
.flow-svg path.failed { stroke: var(--err); }
.flow-svg path.undelivered { stroke: var(--err); }
.flow-svg path.undelivered-line { stroke: var(--err); stroke-width: 1.5; stroke-dasharray: 5 4; opacity: .9; }
.flow-svg path.pulse { stroke: var(--surface); stroke-width: 1.5; stroke-dasharray: 2 12; stroke-linecap: round; opacity: .8; animation: flow 1.6s linear infinite; }
@keyframes flow { to { stroke-dashoffset: -28; } }
.flow-legend { display: flex; flex-wrap: wrap; align-items: center; gap: 6px 18px; border-top: 1px solid var(--line); padding: 10px 0 12px; font-size: 11px; color: var(--muted); position: relative; z-index: 1; }
.flow-legend span { display: inline-flex; align-items: center; gap: 6px; }
.flow-legend i { display: inline-block; width: 18px; height: 0; border-top: 2px solid var(--flow); }
.flow-legend i.thick { border-top-width: 6px; border-radius: 1px; }
.flow-legend i.failed { border-top-color: var(--err); }
.flow-legend i.reachable { border-top-color: var(--warn); opacity: .7; }
.flow-legend i.undelivered { border-top: 2px dashed var(--err); }
.flow-legend .legend-note { margin-left: auto; color: var(--faint); }
.flow-empty { background: var(--surface); border-radius: var(--r-card); box-shadow: var(--card-shadow); }
.flow-table-wrap { background: var(--surface); border-radius: var(--r-card); overflow: hidden; box-shadow: var(--card-shadow); }
.flow-table { width: 100%; border-collapse: collapse; font-size: 12px; }
.flow-table th { text-align: left; font-size: 11px; font-weight: 600; color: var(--muted); padding: 10px 20px; border-bottom: 1px solid var(--line); }
.flow-table td { text-align: left; padding: 9px 20px; border-bottom: 1px solid var(--line); font-variant-numeric: tabular-nums; }
.flow-table tr:last-child td { border-bottom: 0; }
.flow-table .n { text-align: right; }
.flow-table td.bad { color: var(--err); }
.pin-tag { display: inline-flex; align-items: center; gap: 3px; height: 18px; padding: 0 6px; border-radius: var(--r-tag); background: var(--accent-soft); color: var(--accent); font-size: 10.5px; font-weight: 500; white-space: nowrap; flex: none; max-width: 100%; overflow: hidden; text-overflow: ellipsis; }
.pin-tag svg { width: 11px; height: 11px; stroke-width: 2; }
.flow-node strong.has-pin { display: flex; align-items: center; gap: 6px; }
.flow-node strong.has-pin > span:first-child { overflow: hidden; text-overflow: ellipsis; min-width: 3em; flex: 0 1 auto; }
/* The caller name wins over the tag; the tag shrinks to just the pin and the tooltip has the rest. */
.flow-node strong .pin-tag { height: 16px; font-size: 10px; padding: 0 5px; max-width: 110px; flex: 0 100 auto; min-width: 20px; display: inline-block; line-height: 16px; }
.flow-node strong .pin-tag svg { vertical-align: -1px; margin-right: 2px; }
.flow-canvas.compact .flow-col:first-child { width: min(230px, 44%); }
.flow-node small .pin-tag { height: 15px; font-size: 10px; padding: 0 5px; }
button.rule-chip { min-height: 32px; height: 32px; padding: 0 10px; font-size: 12px; background: var(--surface); box-shadow: var(--card-shadow); color: var(--muted); gap: 6px; }
button.rule-chip.on { color: var(--accent); }
button.rule-chip svg { width: 13px; height: 13px; }
button.rule-chip:hover { background: var(--surface); color: var(--text); }

/* ---------- UA rules ---------- */
.rules-section { margin-top: 36px; scroll-margin-top: 64px; }
.rules-wrap { background: var(--surface); border-radius: var(--r-card); box-shadow: var(--card-shadow); overflow: hidden; }
.rule-table { width: 100%; border-collapse: collapse; font-size: 12px; table-layout: fixed; }
.rule-table th { text-align: left; font-size: 11px; font-weight: 600; color: var(--muted); padding: 10px 12px; border-bottom: 1px solid var(--line); }
.rule-table td { padding: 10px 12px; border-bottom: 1px solid var(--line); vertical-align: middle; overflow-wrap: anywhere; }
.rule-table tr:last-child td { border-bottom: 0; }
.rule-table th:first-child, .rule-table td:first-child { padding-left: 20px; width: 44px; color: var(--faint); font-variant-numeric: tabular-nums; }
.rule-table th:last-child, .rule-table td:last-child { padding-right: 20px; }
.rule-table .mode { width: 92px; }
.rule-table .target { width: 180px; }
.rule-table .pattern { font-family: var(--mono); font-size: 12px; }
.rule-table .target-line { display: inline-flex; align-items: center; gap: 6px; font-weight: 500; }
.rule-table .target-line small { color: var(--muted); font-weight: 400; font-size: 11px; }
.rule-table td.note { color: var(--muted); }
.rules-empty { padding: 20px; display: flex; align-items: center; gap: 12px; color: var(--muted); font-size: 12px; flex-wrap: wrap; }
.rules-empty p { flex: 1; min-width: 200px; }
#uaDialog { width: min(820px,calc(100% - 32px)); }
.rule-rows { display: flex; flex-direction: column; gap: 8px; }
.rule-row-head, .rule-row { display: grid; grid-template-columns: 104px minmax(0,1.5fr) 150px minmax(0,1fr) 92px; gap: 8px; align-items: center; }
.rule-row-head { font-size: 11px; font-weight: 600; color: var(--muted); padding: 0 2px; margin-bottom: 6px; }
.rule-row input, .rule-row select { width: 100%; min-width: 0; border: 1px solid transparent; background-color: var(--field); min-height: 34px; padding: 6px 10px; border-radius: var(--r-ctl); font-size: 12px; outline: none; }
.rule-row select { padding-right: 26px; }
.rule-row input.pattern { font-family: var(--mono); }
.rule-row input:focus, .rule-row select:focus { box-shadow: 0 0 0 2px var(--accent); }
.rule-row [aria-invalid=true] { border-color: var(--err); }
.rule-row .row-tools { display: flex; gap: 0; justify-content: flex-end; }
.rule-row .row-tools button.icon { width: 28px; height: 28px; }
.rule-row-error { grid-column: 1 / -1; color: var(--err); font-size: 11px; margin: -2px 0 2px 2px; }
.rule-help { color: var(--muted); font-size: 11px; line-height: 1.7; margin-top: 14px; padding: 10px 12px; background: var(--field); border-radius: var(--r-ctl); }
.rule-help code { font-family: var(--mono); font-size: 11px; color: var(--text); }
.rule-add { margin: 10px 0 0 -10px; font-size: 12px; }

/* ---------- Events ---------- */
.event-section { margin-top: 36px; }
.filter { font-size: 12px; display: inline-flex; align-items: center; gap: 6px; color: var(--muted); cursor: pointer; }
input[type="checkbox"] { accent-color: var(--accent); margin: 0; }
.event-list { max-height: 320px; overflow: auto; background: var(--surface); border-radius: var(--r-card); box-shadow: var(--card-shadow); }
.event { display: grid; grid-template-columns: 136px 150px minmax(0,1fr); gap: 12px; align-items: baseline; padding: 9px 20px; position: relative; font-size: 12px; }
.event + .event { border-top: 1px solid var(--line); }
.event time { color: var(--muted); font-variant-numeric: tabular-nums; font-size: 11px; white-space: nowrap; }
.event-kind { color: var(--muted); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; min-width: 0; }
.event > button.event-kind { min-height: 0; padding: 0; background: none; justify-content: flex-start; font-size: 12px; border-radius: 4px; text-align: left; display: block; }
.event > button.event-kind:hover { color: var(--accent); background: none; }
.event-message { overflow-wrap: anywhere; }
.event.failover::before { content: ""; position: absolute; width: 3px; inset: 9px auto 9px 0; background: var(--accent); border-radius: 0 2px 2px 0; }
.event.failover .event-kind { color: var(--accent); }
.event.error .event-message { color: var(--err); }
.event.warn .event-message { color: var(--warn); }
.empty { text-align: center; padding: 32px 24px; color: var(--muted); }
.empty h2 { color: var(--text); margin-bottom: 6px; }
.empty button { margin-top: 16px; }

/* ---------- Bottom drawer & status bar ---------- */
.bottom-drawer { grid-column: 2; background: var(--surface); min-height: 0; overflow: hidden; display: flex; flex-direction: column; border-top: 1px solid var(--line); position: relative; box-shadow: 0 -8px 24px rgba(0,0,0,.05); }
.shell.sidebar-hidden .bottom-drawer { grid-column: 1; }
.drawer-handle { position: absolute; height: 8px; top: -4px; left: 0; right: 0; cursor: row-resize; touch-action: none; z-index: 5; }
.bottom-drawer > .drawer-handle { top: 0; height: 10px; }
.bottom-drawer > .drawer-handle::after { content: ""; position: absolute; left: 50%; top: 4px; width: 36px; height: 4px; margin-left: -18px; border-radius: 4px; background: var(--line); transition: background 120ms; }
.bottom-drawer > .drawer-handle:hover::after { background: var(--faint); }
.drawer-toolbar { display: flex; align-items: center; gap: 8px; padding: 14px var(--pad-x) 10px; flex-wrap: wrap; border-bottom: 1px solid var(--line); }
.drawer-toolbar input[type=search] { border: 0; background: var(--field); height: 28px; padding: 0 10px; border-radius: var(--r-ctl); width: 160px; font-size: 12px; outline: none; }
.drawer-toolbar input[type=search]:focus { box-shadow: 0 0 0 2px var(--accent); }
.drawer-toolbar select { max-width: 150px; }
.drawer-toolbar .filter { margin-left: 4px; }
.drawer-toolbar .drawer-actions { display: flex; gap: 2px; margin-right: -6px; }
.drawer-toolbar .drawer-actions button.icon { width: 28px; height: 28px; }
.drawer-body { overflow: auto; min-height: 0; flex: 1; padding: 12px var(--pad-x) 16px; }
.drawer-body .event-list { max-height: none; box-shadow: none; background: transparent; border-radius: 0; }
.drawer-body .event { padding-left: 0; padding-right: 0; }
.drawer-body .event.failover { padding-left: 12px; }
.runtime-grid { display: grid; grid-template-columns: 120px minmax(0,1fr); gap: 0; padding: 0; font-size: 12px; }
.runtime-grid dt, .runtime-grid dd { padding: 9px 0; border-bottom: 1px solid var(--line); }
.runtime-grid dd { margin: 0; overflow-wrap: anywhere; }
.statusbar { position: relative; background: var(--surface); display: flex; align-items: center; flex-wrap: wrap; gap: 6px 16px; min-height: 36px; padding: 4px var(--pad-x); font-size: 11px; color: var(--muted); border-top: 1px solid var(--line); }
.statusbar #drawerToggle { margin-right: -10px; min-height: 26px; padding: 2px 10px; font-size: 11px; }
.statusbar #drawerToggle svg { width: 12px; height: 12px; transition: transform 120ms; }
.statusbar #drawerToggle[aria-expanded=true] svg { transform: rotate(180deg); }
.connection { display: inline-flex; align-items: center; gap: 6px; color: var(--text); }
.configpath { min-width: 0; flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-size: 10px; text-align: right; }
.sidebar-toggle { display: none; }
.shell.sidebar-hidden { grid-template-columns: minmax(0,1fr); }
.shell.sidebar-hidden .sidebar { display: none; }
.shell.sidebar-hidden .sidebar-toggle { display: inline-flex; }
.shell.dragging, .shell.dragging * { cursor: row-resize !important; user-select: none; }

/* ---------- Settings ---------- */
#settingsDialog { width: min(720px,calc(100% - 32px)); }
#settingsPage { background: var(--surface); border-radius: var(--r-card); box-shadow: var(--card-shadow); }
#settingsPage .dialog-head { padding: 24px 28px 16px; }
#settingsPage .form-body { padding: 0 28px 8px; }
#settingsPage .dialog-foot { position: sticky; bottom: 0; border-radius: 0 0 var(--r-card) var(--r-card); padding: 12px 28px; z-index: 1; }
#settingsPage #settingsClose { display: none; }
.settings-section { border: 0; border-top: 1px solid var(--line); padding: 20px 0 22px; margin: 0; min-width: 0; }
.settings-section:first-child { border-top: 0; padding-top: 4px; }
.settings-section legend { float: left; width: 100%; padding: 0; font-weight: 600; font-size: 13px; margin-bottom: 4px; }
.settings-section legend + * { clear: both; }
.settings-section .section-desc { color: var(--muted); font-size: 12px; margin-bottom: 14px; clear: both; }
.settings-section > .field-hint { display: block; clear: both; }
.settings-section .fields { gap: 12px 20px; }
.settings-section .field { gap: 5px; }
.settings-section .field input:disabled { opacity: .55; }
.settings-section .label-row { display: flex; align-items: center; gap: 8px; min-width: 0; min-height: 18px; }
.settings-section .label-row label { display: flex; align-items: baseline; gap: 8px; min-width: 0; flex: 1; font-weight: 400; cursor: default; }
.settings-section .field-key { font-family: var(--mono); font-size: 11.5px; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; min-width: 0; flex: 0 1 auto; letter-spacing: -.1px; }
.settings-section .field-name { font-size: 12px; font-weight: 500; color: var(--text); white-space: nowrap; flex: none; }
.effect { font-size: 10px; font-weight: 500; height: 18px; padding: 0 6px; border-radius: var(--r-tag); display: inline-flex; align-items: center; white-space: nowrap; background: var(--field); color: var(--muted); margin-left: auto; }
.effect.restart { background: var(--warn-soft); color: var(--warn); }
.effect.saved { background: var(--accent-soft); color: var(--accent); }
.field.toggle { flex-direction: row; align-items: center; justify-content: space-between; background: var(--field); border-radius: var(--r-ctl); padding: 6px 12px; align-self: end; min-height: 34px; gap: 12px; }
.field.toggle .label-row { flex: 1; }
.field.toggle .effect { margin-left: 6px; }
.theme-row { display: flex; align-items: center; gap: 12px; clear: both; }
.theme-row select { min-height: 32px; min-width: 140px; }

/* ---------- YAML dialog ---------- */
#yamlDialog { width: min(880px,calc(100% - 32px)); }
.cfg { padding: 0 24px 20px; display: flex; flex-direction: column; gap: 10px; }
.cfg textarea { height: min(62vh, 640px); min-height: 240px; resize: vertical; width: 100%; background: var(--field); border: 0; padding: 12px; border-radius: var(--r-ctl); font-family: var(--mono); font-size: 12px; tab-size: 2; outline: none; }
.cfg textarea:focus { box-shadow: 0 0 0 2px var(--accent); }
.cfg-actions { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
.error-box { color: var(--err); background: var(--err-soft); padding: 10px 12px; border-radius: var(--r-ctl); white-space: pre-wrap; overflow-wrap: anywhere; font-size: 12px; }

/* ---------- Dialogs & forms ---------- */
dialog { width: min(580px,calc(100% - 32px)); max-height: calc(100% - 48px); margin: auto; padding: 0; border: 0; border-radius: var(--r-dialog); color: var(--text); background: var(--surface); box-shadow: var(--shadow); }
dialog::backdrop { background: rgba(0,0,0,.2); backdrop-filter: blur(4px); }
.dialog-head { padding: 24px 24px 16px; display: flex; gap: 16px; align-items: flex-start; }
.dialog-head h2 { font-size: 20px; letter-spacing: -.3px; line-height: 1.3; }
.dialog-head p { font-size: 12px; color: var(--muted); margin-top: 4px; }
.dialog-head .icon { margin: -4px -8px 0 auto; }
.form-body { padding: 0 24px 24px; }
.fields { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
.field { display: flex; flex-direction: column; gap: 6px; min-width: 0; }
.field.wide { grid-column: 1 / -1; }
.field label { font-size: 12px; font-weight: 500; }
.field input, .field textarea, .field select { border: 1px solid transparent; border-radius: var(--r-ctl); background-color: var(--field); width: 100%; min-height: 34px; padding: 6px 10px; font-size: 13px; outline: none; }
.field select { padding-right: 28px; }
.field input:focus, .field textarea:focus, .field select:focus { box-shadow: 0 0 0 2px var(--accent); }
.field textarea { min-height: 64px; resize: vertical; }
.field input[readonly], .field select:disabled { color: var(--muted); }
.field input[aria-invalid="true"] { border-color: var(--err); }
.field-hint { color: var(--muted); font-size: 11px; }
.field-error { color: var(--err); font-size: 11px; }
.switch-row { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 10px 12px; background: var(--field); border-radius: var(--r-ctl); grid-column: 1 / -1; }
.switch-row p { font-size: 11px; color: var(--muted); }
.switch { appearance: none; -webkit-appearance: none; width: 34px; height: 20px; min-height: 0 !important; padding: 0 !important; background: var(--faint) !important; border-radius: 99px !important; position: relative; margin: 0; cursor: pointer; flex: none; transition: background 120ms; width: 34px !important; }
.switch::before { content: ""; position: absolute; width: 16px; height: 16px; background: white; border-radius: 50%; top: 2px; left: 2px; box-shadow: 0 1px 2px rgba(0,0,0,.2); transition: left 120ms; }
.switch:checked { background: var(--accent) !important; }
.switch:checked::before { left: 16px; }
.form-advanced { margin-top: 20px; border-top: 1px solid var(--line); }
.form-advanced > summary { padding: 12px 0; cursor: pointer; color: var(--muted); font-size: 12px; }
.form-advanced .fields { margin-top: 4px; }
.headers-editor { grid-column: 1 / -1; }
.headers-label { font-size: 12px; font-weight: 500; margin-bottom: 6px; }
.header-pair { display: grid; grid-template-columns: minmax(0,1fr) minmax(0,1.5fr) 32px; gap: 8px; margin-bottom: 8px; }
.header-pair input { width: 100%; min-width: 0; border: 0; background: var(--field); min-height: 34px; padding: 6px 10px; border-radius: var(--r-ctl); outline: none; }
.header-pair input:focus { box-shadow: 0 0 0 2px var(--accent); }
.headers-editor > button { font-size: 12px; margin-left: -10px; }
.dialog-foot { padding: 14px 24px; display: flex; align-items: center; justify-content: flex-end; gap: 8px; background: var(--surface); border-top: 1px solid var(--line); position: sticky; bottom: 0; }
.dialog-foot .result { margin-right: auto; }
.form-error { margin-top: 16px; }
.form-note { color: var(--muted); font-size: 11px; margin-top: 20px; }
.confirm-copy { padding: 0 24px 24px; color: var(--muted); overflow-wrap: anywhere; }
.service-item[draggable=true] { cursor: grab; }
.service-item.drag-over { box-shadow: inset 0 2px var(--accent); }
.loading svg { animation: spin 1s linear infinite; }
@keyframes spin { to { transform: rotate(360deg); } }

@media (max-width: 960px) {
  .shell { grid-template-columns: 220px minmax(0,1fr); }
  .content { padding: 12px 24px 32px; }
  :root { --pad-x: 24px; }
  html[data-theme] { --pad-x: 24px; }
  .stats { grid-template-columns: repeat(3,minmax(0,1fr)); }
  .event { grid-template-columns: 130px minmax(0,1fr); gap: 2px 12px; }
  .event-message { grid-column: 1 / -1; }
  .dash-flow-grid { grid-template-columns: minmax(0,1fr); }
}
@media (max-width: 680px) {
  :root, html[data-theme] { --pad-x: 16px; }
  .shell { display: flex; flex-direction: column; }
  .sidebar { padding: 12px; flex: none; max-height: none; border-right: 0; border-bottom: 1px solid var(--line); }
  .services-disclosure, .services-disclosure:not([open]) { flex: none; }
  .sidebar-foot { margin-top: 4px; }
  .brand { padding: 0 4px 12px; }
  .brand-sub { display: none; }
  .sidebar-foot { padding-top: 4px; }
  .sidebar-foot p { display: none; }
  .search { margin: 4px 0 8px; }
  .service-list { display: flex; gap: 8px; overflow: auto; }
  .service-item { width: 180px; flex: none; }
  .workspace { flex: 1; }
  .toolbar { height: 48px; }
  .content { padding: 12px 16px 32px; }
  .route { padding: 16px 16px 12px; }
  .fields { grid-template-columns: 1fr; }
  .field.wide { grid-column: auto; }
  .dialog-head { padding: 20px 16px 16px; }
  .form-body { padding: 0 16px 20px; }
  .dialog-foot { padding: 12px 16px; }
  .bottom-drawer:not([hidden]) { position: fixed; inset: 20px 0 0; z-index: 8; height: auto !important; border-radius: var(--r-card) var(--r-card) 0 0; }
  .flow-canvas { display: none; }
  .dash-flow-section { display: none; }
  .rule-row-head { display: none; }
  .rule-row { grid-template-columns: 1fr 1fr; }
  .rule-row input.pattern, .rule-row input.note { grid-column: 1 / -1; }
  .rule-table .mode { width: 64px; } .rule-table .target { width: 110px; } .rule-table .note { display: none; }
  .flow-table { font-size: 11px; }
  .flow-table th, .flow-table td { padding: 6px 10px; }
}
@media (prefers-reduced-motion: reduce) { button, .switch, .switch::before { transition: none; } .loading svg { animation: none; } .flow-svg path { animation: none; transition: none; } .flow-svg path.pulse { display: none; } }
</style>
</head>
<body>
<div class="shell" id="shell">
  <aside class="sidebar" aria-label="服务导航">
    <div class="brand"><div class="brand-mark" id="brandMark"></div><div><div class="brand-name">Linkgate</div><div class="brand-sub">本地入口，多条线路。</div></div><button id="collapseSidebar" class="icon quiet" aria-label="收起服务导航" title="收起服务导航"></button></div>
    <button class="nav-item" id="dashboardButton" type="button"><span class="nav-icon" id="dashboardIcon"></span>全局仪表盘</button>
    <label class="search"><span id="searchIcon"></span><input id="search" type="search" placeholder="搜索服务" aria-label="搜索服务"></label>
    <details class="services-disclosure" id="serviceDisclosure" open><summary>服务 <span id="serviceCount">0</span></summary><nav class="service-list" id="serviceList" aria-label="选择服务"></nav></details>
    <button class="nav-item accent sidebar-add" id="addService" type="button"><span class="nav-icon" id="addServiceIcon"></span>添加服务</button>
    <div class="sidebar-foot"><button class="nav-item" id="settingsButton" type="button"><span class="nav-icon" id="settingsIcon"></span>设置</button><p>只在连接建立前换线路。<br>连接建立后，绝不重发。</p></div>
  </aside>
  <main class="workspace">
    <div class="toolbar"><button class="icon quiet sidebar-toggle" id="expandSidebar" aria-label="展开服务导航" title="展开服务导航"></button><div class="breadcrumb"><span>服务</span><span aria-hidden="true">/</span><span id="breadcrumb">概览</span></div><span class="spacer"></span><span id="reloadResult" class="result" role="status"></span><button class="quiet" id="openYaml" type="button" title="直接编辑整份配置文件（YAML）">编辑 YAML</button><button class="quiet" id="reload" type="button" title="重新读取配置文件并应用">重新加载</button></div>
    <div class="content">
      <div class="notice" id="notice" role="status" hidden></div>
