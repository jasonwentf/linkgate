# Linkgate 配置示例。
# 真实地址请写在你自己的 ~/.linkgate/config.yaml，不要改进仓库。
# 生成一份可用的初始配置：linkgate -init
version: 1

admin:
  listen: 127.0.0.1:8766

log:
  level: info
  format: text
  ring_size: 2000
  file: ~/.linkgate/kernel.log    # 内核轮转文件日志；留空才写 stdout
  max_size_bytes: 10485760       # 当前文件 10 MiB，加 3 份备份
  max_backups: 3

# 请求体常达数 MB：小于 8MiB 放内存，超过落临时文件
buffer:
  max_request_bytes: 134217728
  spill_threshold: 8388608
  max_concurrent: 64             # 每组
  global_max_concurrent: 64      # 所有组共享，包含缓冲和转发

http:
  connect_timeout: 2s
  tls_handshake_timeout: 5s
  response_header_timeout: 900s   # 模型可能长时间思考，首字节要放宽
  stream_idle_timeout: 900s       # 流中途多久没数据算卡死
  upload_idle_timeout: 60s        # 上传请求体多久没有进展算卡死
  response_header_warn_after: 120s
  keep_alive: 30s
  disable_compression: true      # 默认不让 Go 自动 gzip/解压，保持透明

retry:
  max_attempts: 3
  mode: connect                   # 只在连接未建立时换线路，避免重复计费
  backoff: 150ms

health:
  enabled: true
  interval: 15s
  timeout: 3s
  fail_threshold: 2
  recover_threshold: 2
  cooldown: 20s
  probe_path: /health
  probe:
    type: http                    # http 或 tcp_connect（只探测建连，不是 TCP 转发）

# 以下 URL 均为文档占位。示例线路默认停用，替换成真实地址后再 enabled: true。
groups:
  - name: demo
    listen: 127.0.0.1:8765
    protocol: http                # 默认 http；tcp 暂未支持
    # 优先级：数字越小越先走，允许 0；省略时按顺序给 10/20/...。
    upstreams:
      # 中转线路示例
      - name: relay
        enabled: false
        kind: frp                 # 仅元数据，不参与选路
        url: http://192.0.2.1:8000 # TEST-NET-1 占位地址
        priority: 5

      - name: tailscale
        enabled: false
        kind: ts
        url: http://203.0.113.10:8090 # TEST-NET-3 占位地址
        priority: 10

      - name: zerotier
        enabled: false
        kind: zt
        url: http://198.51.100.20:8090 # TEST-NET-2 占位地址
        priority: 20

      # Cloudflare Tunnel；开了 Access 才需要下面两个头
      - name: cloudflare
        enabled: false
        kind: cf
        url: https://backend.example.com # example.com 文档占位域名
        priority: 30
        host: backend.example.com
        headers:
          CF-Access-Client-Id: "<ID>"
          CF-Access-Client-Secret: "<SECRET>"
        health_path: /health
        max_body_bytes: 2097152      # CF 边缘约 100s 就 524，大请求别排给它
        failure_statuses: [524]      # 524 只可能由 CF 产生，可安全计为线路故障
