version: 2

project_name: linkgate

before:
  hooks:
    - go run ./tools/genicons
    - go run ./tools/genversion -version {{ .Version }}

builds:
  - id: kernel
    main: ./cmd/linkgate
    binary: linkgate
    env:
      - CGO_ENABLED=0
    goos:
      - linux
      - windows
      - darwin
    goarch:
      - amd64
      - arm64
    ldflags:
      - -s -w -X linkgate/internal/app.Version={{.Version}} -X main.version={{.Version}}
    flags:
      - -trimpath

  - id: tray
    main: ./cmd/linkgate-tray
    binary: linkgate-tray
    env:
      - CGO_ENABLED=1
      - MACOSX_DEPLOYMENT_TARGET=13.0
      - CGO_CFLAGS=-mmacosx-version-min=13.0
      - CGO_LDFLAGS=-mmacosx-version-min=13.0
    goos:
      - darwin
      - windows
    goarch:
      - amd64
      - arm64
    ignore:
      - goos: windows
        goarch: arm64
    ldflags:
      - -s -w -X linkgate/internal/app.Version={{.Version}} -X main.version={{.Version}}
    flags:
      - -trimpath
    overrides:
      - goos: windows
        goarch: amd64
        env:
          - CGO_ENABLED=0
        ldflags:
          - -s -w -H=windowsgui -X linkgate/internal/app.Version={{.Version}} -X main.version={{.Version}}
      - goos: darwin
        goarch: amd64
        env:
          - CGO_ENABLED=1
          - MACOSX_DEPLOYMENT_TARGET=13.0
          - CGO_CFLAGS=-mmacosx-version-min=13.0
          - CGO_LDFLAGS=-mmacosx-version-min=13.0
          - CC=clang -arch x86_64
          - CXX=clang++ -arch x86_64

archives:
  - id: windows-pkg
    ids: [kernel, tray]
    allow_different_binary_count: true # Windows arm64 is kernel-only.
    name_template: "linkgate_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    formats: [zip]
    format_overrides:
      - goos: linux
        formats: [none]
      - goos: darwin
        formats: [none]
    files:
      - LICENSE
      - README.md
      - README.zh.md
      - configs/linkgate.example.yaml
      - src: deploy/windows/common.ps1
        dst: .
        strip_parent: true
      - src: deploy/windows/transaction.ps1
        dst: .
        strip_parent: true
      - src: deploy/windows/install.ps1
        dst: .
        strip_parent: true
      - src: deploy/windows/update.ps1
        dst: .
        strip_parent: true
      - src: deploy/windows/*.bat
        dst: .
        strip_parent: true
  - id: unix-pkg
    ids: [kernel, tray]
    allow_different_binary_count: true # Linux is kernel-only.
    name_template: "linkgate_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    formats: [tar.gz]
    format_overrides:
      - goos: windows
        formats: [none]
    files:
      - LICENSE
      - README.md
      - README.zh.md
      - configs/linkgate.example.yaml
      - deploy/linkgate.service

nfpms:
  - id: linkgate
    package_name: linkgate
    ids: [kernel]
    formats: [deb, rpm, ipk]
    file_name_template: "linkgate_{{ .Version }}_{{ .Arch }}"
    vendor: Linkgate
    homepage: https://github.com/jasonwentf/linkgate
    maintainer: JasonWen
    description: >-
      Local transparent HTTP reverse proxy. One fixed local address,
      multiple upstream routes, automatic failover. Kernel only; the
      web panel is served by the kernel itself.
    license: MIT
    bindir: /usr/bin
    contents:
      - src: configs/linkgate.example.yaml
        dst: /etc/linkgate/config.yaml
        type: config|noreplace
        file_info:
          mode: 0640
          owner: root
          group: linkgate
      - src: deploy/linkgate.service
        dst: /usr/lib/systemd/system/linkgate.service
    scripts:
      postinstall: ./deploy/nfpm-postinstall.sh
      preremove: ./deploy/nfpm-preremove.sh
      postremove: ./deploy/nfpm-postremove.sh

checksum:
  name_template: "checksums.txt"

release:
  # 置顶两个最常用下载：Windows 向导安装器 + macOS 拖拽 dmg。勿删。
  header: |
    **Most-used downloads** — [Linkgate-Setup-{{ .Version }}-win64.exe](https://github.com/jasonwentf/linkgate/releases/download/v{{ .Version }}/Linkgate-Setup-{{ .Version }}-win64.exe)（Windows 向导安装器）· [Linkgate-{{ .Version }}.dmg](https://github.com/jasonwentf/linkgate/releases/download/v{{ .Version }}/Linkgate-{{ .Version }}.dmg)（macOS 拖拽安装）
  name_template: "v{{ .Version }}"

snapshot:
  version_template: "{{ incpatch .Version }}-next"

changelog:
  sort: asc
  filters:
    exclude:
      - "^docs:"
      - "^test:"
